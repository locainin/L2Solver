name: Prepare the isolated Linux test runner
description: Install the tools and scoped permissions needed by integration tests
runs:
  using: composite
  steps:
    - name: Install candidate check tools
      shell: bash
      run: |
        sudo apt-get update
        sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
          apparmor binutils dbus-user-session ethtool fish iproute2 iputils-ping libcap2-bin libpcap-dev \
          python3-pytest python3-pytest-subtests python3-scapy ripgrep strace tcpdump tshark zsh

    - name: Permit isolated test namespaces
      shell: bash
      run: |
        # Grant user namespaces to unshare without changing the system-wide policy
        namespace_profile="$RUNNER_TEMP/l2solver-ci-unshare.profile"
        cat > "$namespace_profile" <<'PROFILE'
        abi <abi/4.0>,
        profile l2solver-ci-unshare /usr/bin/unshare flags=(unconfined) {
          userns,
        }
        PROFILE
        sudo apparmor_parser --replace "$namespace_profile"
        unshare --user --map-root-user --net --mount --pid --mount-proc --fork true

    - name: Prepare isolated-test user services
      shell: bash
      run: |
        # Delegated test scopes need the runner's own user manager and bus
        test_uid=$(id -u)
        test_runtime="/run/user/$test_uid"
        sudo loginctl enable-linger "$(id -un)"
        sudo systemctl start "user@$test_uid.service"
        printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' \
          "$test_runtime" "$test_runtime" >> "$GITHUB_ENV"
