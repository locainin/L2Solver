---
name: Linux release candidate

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: Validate and package Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the requested commit
        # Pin the checkout implementation to the reviewed v7.0.1 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install stable Rust components
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy --component rustfmt \
            --target x86_64-unknown-linux-gnu
          rustup default stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace Clippy
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings

      - name: Run workspace tests
        run: >-
          cargo test --workspace --all-targets --all-features --locked

      - name: Run documentation tests
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --workspace --doc --all-features --locked

      - name: Check Rust documentation warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Build Linux release candidate
        run: >-
          cargo build --locked --release --package l2-cli
          --target x86_64-unknown-linux-gnu

      - name: Install candidate check tools
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils fish python3-pytest python3-pytest-subtests tshark zsh

      - name: Run Python benchmark regressions
        run: >-
          /usr/bin/python3 -m pytest -q tests/benchmarks
          -p subtests
          --ignore=tests/benchmarks/test_cgroup_enforcement.py
          --ignore=tests/benchmarks/test_filesystem_fault_runner.py

      - name: Check generated completion syntax
        shell: bash
        run: |
          for shell in bash zsh fish; do
            completion=$(target/x86_64-unknown-linux-gnu/release/l2solver completions "$shell")
            if [[ -z "$completion" ]]; then
              printf 'empty %s completion script\n' "$shell" >&2
              exit 1
            fi
            printf '%s\n' "$completion" | "$shell" -n
          done

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.0

      - name: Check dependency policy
        run: |
          cargo deny --frozen check
          cargo deny --frozen --manifest-path fuzz/Cargo.toml check

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.0

      - name: Check security advisories
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file fuzz/Cargo.lock

      - name: Package build provenance and checksum
        run: >-
          /usr/bin/python3 -m benchmarks.package_release
          --binary target/x86_64-unknown-linux-gnu/release/l2solver
          --lockfile Cargo.lock
          --output-directory "$RUNNER_TEMP/l2solver-dist"

      - name: Check packaged executable and record blocked release work
        run: >-
          /usr/bin/python3 -m benchmarks.qualification
          --package-directory "$RUNNER_TEMP/l2solver-dist"
          --output-directory "$RUNNER_TEMP/l2solver-qualification"
          --candidate-only

      - name: Upload unqualified review candidate
        # Pin the upload implementation to the reviewed v7.0.0 commit
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: l2solver-linux-x86_64-unqualified-review
          path: |
            ${{ runner.temp }}/l2solver-dist/
            ${{ runner.temp }}/l2solver-qualification/qualification.json
            ${{ runner.temp }}/l2solver-qualification/elf-*.txt
            ${{ runner.temp }}/l2solver-qualification/cli/*/stdout.log
            ${{ runner.temp }}/l2solver-qualification/cli/*/stderr.log
            ${{ runner.temp }}/l2solver-qualification/cli/*-output/manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
