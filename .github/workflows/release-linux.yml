---
name: Linux release candidate

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: Validate and package Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    env:
      CARGO_TERM_COLOR: always
    steps:
      - name: Check out the requested commit
        # Pin the checkout implementation to the reviewed v7.0.1 commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install stable Rust components
        run: |
          rustup toolchain install stable --profile minimal \
            --component clippy --component rustfmt \
            --target x86_64-unknown-linux-gnu
          rustup default stable

      - name: Install candidate check tools
        shell: bash
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            binutils dbus-user-session ethtool fish iproute2 iputils-ping libcap2-bin libpcap-dev \
            libsqlite3-dev python3-pytest python3-pytest-subtests python3-scapy tcpdump tshark zsh

      - name: Prepare isolated-test user services
        shell: bash
        run: |
          test_uid=$(id -u)
          test_runtime="/run/user/$test_uid"
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$test_uid.service"
          printf 'XDG_RUNTIME_DIR=%s\nDBUS_SESSION_BUS_ADDRESS=unix:path=%s/bus\n' \
            "$test_runtime" "$test_runtime" >> "$GITHUB_ENV"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check workspace Clippy
        run: >-
          cargo clippy --workspace --all-targets --all-features --locked --
          -D warnings

      - name: Install pinned Nextest
        run: cargo install cargo-nextest --locked --version 0.9.138

      - name: Run workspace tests with Nextest
        run: >-
          cargo nextest run --workspace --all-targets --all-features --locked
          --status-level skip --final-status-level skip

      - name: Run documentation tests
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo test --workspace --doc --all-features --locked

      - name: Check Rust documentation warnings
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps --locked

      - name: Build Linux release candidate
        run: >-
          cargo build --locked --release --package l2-cli --package l2-active-cli --package l2-active-linux
          --bin l2solver --bin l2solver-active --bin l2solver-active-helper
          --target x86_64-unknown-linux-gnu

      - name: Run Python benchmark regressions
        run: >-
          /usr/bin/python3 -m pytest -q tests/benchmarks tests/scripts tests/crates
          -p subtests

      - name: Qualify delegated-scope Python cases
        shell: bash
        run: |
          for variant in explicit default; do
            systemd-run --user --scope --quiet -p Delegate=yes \
              /usr/bin/python3 -m pytest -q \
              "tests/benchmarks/test_cgroup_enforcement.py::test_owned_scope_records_resolved_working_directory[$variant]"
          done
          systemd-run --user --scope --quiet -p Delegate=yes -p CPUQuota=100% \
            env L2_TEST_DELEGATED_SCOPE=1 /usr/bin/python3 -m pytest -q \
            tests/benchmarks/test_refine_cgroup_integration.py::RefineCgroupIntegrationTests::test_real_runner_samples_live_unlinked_spool_and_process

      - name: Check generated completion syntax
        shell: bash
        run: |
          for shell in bash zsh fish; do
            completion=$(target/x86_64-unknown-linux-gnu/release/l2solver completions "$shell")
            if [[ -z "$completion" ]]; then
              printf 'empty %s completion script\n' "$shell" >&2
              exit 1
            fi
            printf '%s\n' "$completion" | "$shell" -n
          done

      - name: Install pinned cargo-deny
        run: cargo install cargo-deny --locked --version 0.19.0

      - name: Check dependency policy
        run: |
          cargo deny --frozen check
          cargo deny --frozen --manifest-path fuzz/Cargo.toml check

      - name: Install pinned cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.0

      - name: Check security advisories
        run: |
          cargo audit --file Cargo.lock
          cargo audit --file fuzz/Cargo.lock

      - name: Package build provenance and checksum
        run: >-
          /usr/bin/python3 -m benchmarks.package_release
          --binary target/x86_64-unknown-linux-gnu/release/l2solver
          --helper-binary target/x86_64-unknown-linux-gnu/release/l2solver-active-helper
          --lockfile Cargo.lock
          --output-directory "$RUNNER_TEMP/l2solver-dist"

      - name: Check the extracted active application in isolated networks
        run: >-
          bash benchmarks/check_active_release.sh
          "$RUNNER_TEMP/l2solver-dist/l2solver-x86_64-unknown-linux-gnu.tar.gz"

      - name: Check packaged executable and record blocked release work
        run: >-
          /usr/bin/python3 -m benchmarks.qualification
          --package-directory "$RUNNER_TEMP/l2solver-dist"
          --output-directory "$RUNNER_TEMP/l2solver-qualification"
          --candidate-only

      - name: Upload unqualified review candidate
        # Pin the upload implementation to the reviewed v7.0.0 commit
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f
        with:
          name: l2solver-linux-x86_64-unqualified-review
          path: |
            ${{ runner.temp }}/l2solver-dist/
            ${{ runner.temp }}/l2solver-qualification/qualification.json
            ${{ runner.temp }}/l2solver-qualification/elf-*.txt
            ${{ runner.temp }}/l2solver-qualification/cli/*/stdout.log
            ${{ runner.temp }}/l2solver-qualification/cli/*/stderr.log
            ${{ runner.temp }}/l2solver-qualification/cli/*-output/manifest.json
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
