[package]
name = "l2-cli"
version = "0.2.0"
edition = "2024"
publish = false

[[bin]]
name = "l2solver"
path = "src/main.rs"

[lints]
workspace = true

[features]
live = ["dep:l2-live", "dep:tokio", "dep:wifi-linux"]
dev-fixtures = []

[dependencies]
clap = { version = "4.6", features = ["derive", "string"] }
clap_complete = "4"
ctrlc = "3"
indicatif = "0.18"
rayon = "1.11"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
l2-audit = { version = "=0.2.0", path = "../l2-audit" }
l2-capture = { version = "=0.1.0", path = "../l2-capture" }
l2-engine = { version = "=0.1.0", path = "../l2-engine" }
l2-canary = { version = "=0.1.0", path = "../l2-canary" }
l2-helper-protocol = { version = "=0.1.0", path = "../l2-helper-protocol" }
l2-live = { version = "=0.1.0", path = "../l2-live", optional = true }
tokio = { version = "1.47", features = ["net", "rt"], optional = true }
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
sha2 = "0.10.9"
tempfile = "3"
l2-core = { version = "=0.1.0", path = "../l2-core" }
l2-discovery = { version = "=0.1.0", path = "../l2-discovery" }
l2-workbench = { version = "=0.1.0", path = "../l2-workbench" }
l2-codecs = { version = "=0.1.0", path = "../l2-codecs" }
l2-io = { version = "=0.1.0", path = "../l2-io" }
l2-pcap = { version = "=0.1.0", path = "../l2-pcap" }
wifi-audit = { version = "=0.1.0", path = "../wifi-audit" }
wifi-discovery = { version = "=0.1.0", path = "../wifi-discovery" }
wifi-linux = { version = "=0.1.0", path = "../wifi-linux", optional = true }
wifi-radiotap = { version = "=0.1.0", path = "../wifi-radiotap" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "=0.31.3", features = ["signal"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["fs"] }

[dev-dependencies]
base64 = "0.23.1"
crc32fast = "1.5.0"
png = "=0.18.1"
rusqlite = "0.40.2"
zip = { version = "=9.0.5", default-features = false }

[[bench]]
name = "offline"
harness = false
