[package]
name = "l2-live"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
l2-capture = { version = "=0.1.0", path = "../l2-capture" }
l2-io = { version = "=0.1.0", path = "../l2-io" }
pcap = "2.5"

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "=0.31.3", features = ["net", "socket"] }
rustix = { version = "=1.1.4", features = ["fs"] }
