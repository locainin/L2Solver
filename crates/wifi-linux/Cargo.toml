[package]
name = "wifi-linux"
version = "0.1.0"
edition = "2024"
publish = false

[lints]
workspace = true

[dependencies]
futures = "0.3.31"
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1.47", features = ["rt"] }
wl-nl80211 = "0.7.0"

[dev-dependencies]
proptest = "1.11"
tokio = { version = "1.47", features = ["time"] }
