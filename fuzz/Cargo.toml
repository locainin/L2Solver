[package]
name = "l2solver-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Keep this excluded package independent when the checkout is nested in another workspace
[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
# Fuzz crash oracles intentionally panic; production crates deny panic, unwrap, and expect
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
indexing_slicing = "deny"
cognitive_complexity = "deny"

[package.metadata]
cargo-fuzz = true

[package.metadata.cargo-machete]
# The shared endpoint fixture imports this dependency through an external path module
ignored = ["crc32fast"]

[dependencies]
crc32fast = "1.5"
l2-audit = { path = "../crates/l2-audit", version = "0.2.0" }
l2-capture = { path = "../crates/l2-capture", version = "0.1.0" }
libfuzzer-sys = "0.4"
serde_json = "1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3"
l2-core = { path = "../crates/l2-core", version = "0.1.0" }
l2-codecs = { path = "../crates/l2-codecs", version = "0.1.0" }
l2-canary = { path = "../crates/l2-canary", version = "0.1.0" }
l2-cli = { path = "../crates/l2-cli", version = "0.2.0" }
l2-discovery = { path = "../crates/l2-discovery", version = "0.1.0" }
l2-workbench = { path = "../crates/l2-workbench", version = "0.1.0" }
l2-engine = { path = "../crates/l2-engine", version = "0.1.0" }
l2-helper-protocol = { path = "../crates/l2-helper-protocol", version = "0.1.0" }
l2-onpath = { path = "../crates/l2-onpath", version = "0.1.0" }
l2-pcap = { path = "../crates/l2-pcap", version = "0.1.0" }
l2-segmentation = { path = "../crates/l2-segmentation", version = "0.1.0" }
wifi-codecs = { path = "../crates/wifi-codecs", version = "0.1.0" }
wifi-core = { path = "../crates/wifi-core", version = "0.1.0" }
wifi-discovery = { path = "../crates/wifi-discovery", version = "0.1.0" }
wifi-radiotap = { path = "../crates/wifi-radiotap", version = "0.1.0" }

